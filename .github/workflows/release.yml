name: Release

# Runs on a release tag pushed by `make release VERSION=x.y.z`.
# Monorepo: use '<component>-v*' and strip that prefix in "Version from tag".
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # ubuntu-latest for pure Go. macos-latest when the release builds a
    # macOS app, a DMG or a CGO binary.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0   # full history and tags: release notes need the previous tag

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Check (release gate)
        run: make check

      - name: Build archives
        run: make dist VERSION="$VERSION"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: make publish VERSION="$VERSION"

      # release-homebrew: remove this step when the project has no tap.
      - name: Update Homebrew tap
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: make tap VERSION="$VERSION"
