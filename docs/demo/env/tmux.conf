# tmux setup for the demo: a quiet status bar that shows the windows.
set -g default-shell /usr/bin/zsh
set -g base-index 1
set -g escape-time 0
set -g status-style 'bg=colour235,fg=colour244'
set -g window-status-format ' #I #W '
set -g window-status-current-format ' #I #W '
set -g window-status-current-style 'bg=colour67,fg=colour255,bold'
set -g status-left ''
set -g status-right ''
